[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wyy-visual-assist"
version = "0.1.0"
description = "ADB/OpenCV visual state-machine test tool for Android apps"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2",
  "opencv-python>=4.6",
]

[tool.setuptools.packages.find]
include = ["wyy_assist*"]
